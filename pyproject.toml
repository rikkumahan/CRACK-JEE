[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crack-jee"
version = "0.1.0"
description = "A personal, local MCP server that acts as a performance coach for a JEE aspirant"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Sai Rithvik Mahankali", email = "rikkumahan07@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
]

[project.scripts]
crack-jee = "server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["server", "db", "bkt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
